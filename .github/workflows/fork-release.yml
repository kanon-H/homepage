name: Fork Docker Hub release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Existing fork-vX.Y.Z tag on main; empty only for main build validation"
        type: string
        default: ""
      publish:
        description: "Publish after validation (requires repository opt-in and protected Environment)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-dockerhub-release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    if: github.repository == 'kanon-H/homepage' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      upstream_sha: ${{ steps.plan.outputs.upstream_sha }}
      created: ${{ steps.plan.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.22.1
      - name: Validate trusted main, source tag and release opt-in
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version_tag }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_ENABLED: ${{ vars.DOCKERHUB_RELEASE_ENABLED }}
        run: node scripts/fork-release.mjs

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_UPSTREAM_SHA: ${{ needs.plan.outputs.upstream_sha }}
      RELEASE_CREATED: ${{ needs.plan.outputs.created }}
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      archive_sha256: ${{ steps.digest.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.22.1
      - name: Verify source and toolchain
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          test "$(node --version)" = 'v24.22.1'
          test "$(pnpm --version)" = '10.34.9'
      - name: Prepare isolated image output
        run: |
          mkdir -p "$RUNNER_TEMP/fork-release"
          echo "RELEASE_ARCHIVE=$RUNNER_TEMP/fork-release/image.tar" >> "$GITHUB_ENV"
      - name: Export allowlisted committed build context
        run: node scripts/fork-image-context.mjs
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Verify isolated application build
        run: bash scripts/fork-ci-build.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build both architectures without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/fork-release/context
          file: ${{ runner.temp }}/fork-release/context/Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/fork-release/image.tar
          build-args: |
            BUILDTIME=${{ needs.plan.outputs.created }}
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ needs.plan.outputs.source_sha }}
            UPSTREAM_REVISION=${{ needs.plan.outputs.upstream_sha }}
      - name: Install OCI inspection tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo
      - name: Inspect labels and smoke both platform runtime structures
        run: node scripts/fork-image-smoke.mjs
      - name: Hash the exact tested OCI archive
        id: digest
        shell: bash
        run: echo "archive_sha256=$(sha256sum "$RELEASE_ARCHIVE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload only the tested OCI archive
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-release/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dockerhub-release
    permissions:
      contents: read
      actions: read
    steps:
      # Trusted main controller only; no app install/build or artifact-supplied scripts here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/fork-release
      - name: Install OCI copy tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo
      - name: Publish tested archive without rebuilding or overwriting tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version_tag }}
          RELEASE_PUBLISH: "true"
          RELEASE_ENABLED: ${{ vars.DOCKERHUB_RELEASE_ENABLED }}
          RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RELEASE_UPSTREAM_SHA: ${{ needs.plan.outputs.upstream_sha }}
          RELEASE_CREATED: ${{ needs.plan.outputs.created }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/fork-release/image.tar
          RELEASE_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          RELEASE_RECORD: ${{ runner.temp }}/fork-release/release.json
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: node scripts/fork-image-publish.mjs
      - name: Save non-secret publication record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fork-release-record-${{ github.run_id }}
          path: ${{ runner.temp }}/fork-release/release.json
          if-no-files-found: error
          retention-days: 90
