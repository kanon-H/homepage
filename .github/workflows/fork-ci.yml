name: Fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fork verification
    if: github.repository == 'kanon-H/homepage'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Gate negative probe - expected exit 42
        shell: bash
        run: |
          echo "P6_GATE_NEGATIVE_EXPECTED_FAILURE"
          exit 42

      - name: Validate source commit
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Expected an exact commit SHA.' >&2
            exit 1
          }

      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.22.1

      - name: Verify tool versions and source
        shell: bash
        run: |
          test "$(node --version)" = 'v24.22.1'
          test "$(pnpm --version)" = '10.34.9'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Verified source: %s\n' "$SOURCE_SHA"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build with isolated fictional configuration
        run: bash scripts/fork-ci-build.sh
