name: Fork upstream integration

on:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:
    inputs:
      create_pr:
        description: Create or reuse a draft upstream PR and verify its exact-head CI (no merge).
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-upstream-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate upstream through a draft PR (opt-in)
    if: >-
      github.repository == 'kanon-H/homepage' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.create_pr == true) ||
       (github.event_name == 'schedule' && vars.FORK_UPSTREAM_SYNC_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout trusted main code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.22.1

      - name: Verify Node.js
        run: test "$(node --version)" = 'v24.22.1'

      - name: Merge objects, propose draft PR and verify CI
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          SYNC_WRITE_APPROVED: "true"
          SYNC_TOKEN: ${{ github.token }}
        run: node scripts/fork-upstream-integrate.mjs
