name: Fork upstream preflight

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-upstream-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Upstream main preflight (no PR or push)
    if: github.repository == 'kanon-H/homepage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the trusted main event snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.22.1

      - name: Verify Node.js
        run: test "$(node --version)" = 'v24.22.1'

      - name: Inspect official main without publishing
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: node scripts/fork-upstream-preflight.mjs
